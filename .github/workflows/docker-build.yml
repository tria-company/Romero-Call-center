name: Deploy na VPS (Docker Swarm)

# Trigger: push pra main (auto-deploy) OU manual via Actions -> Run workflow.
#
# Pre-requisito: o primeiro deploy precisa ter sido feito manualmente
# (ver docs/deploy-vps-ubuntu.md). Este workflow assume que ja existe:
#   - /opt/sdr-auton (clone do repo)
#   - ~/sdr-auton.yaml (com secrets reais editados)
#   - stack 'sdr-auton' deployada pelo menos uma vez
#
# Secrets necessarios em Settings -> Secrets and variables -> Actions:
#   - VPS_HOST: IP publico da VPS (84.46.244.167)
#   - VPS_USER: usuario SSH (ex: root)
#   - VPS_SSH_KEY: chave SSH privada (conteudo do arquivo, geralmente ed25519)
#
# Setup completo: docs/auto-deploy-github-actions.md

on:
  push:
    branches: [main]
  workflow_dispatch: # rodar manualmente em Actions -> Run workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/sdr-auton
            # Stash mudanças locais (geralmente edicoes em deploy/sdr-auton.swarm.yaml
            # com credenciais reais que substituem os placeholders ${VAR}).
            # Sem isso, git pull --ff-only falha quando a VPS tem yaml editado.
            # As envs em runtime ficam no docker service, nao dependem do yaml local.
            git stash --include-untracked || true
            git pull --ff-only
            docker build -t agent-sdr-auton:latest .
            # stack deploy nao detecta mudanca quando so a imagem 'latest'
            # tem novo conteudo (mesmo digest no spec). Por isso forcamos o
            # service update -- assim a task e recriada com a imagem nova.
            if docker service ls --filter name=sdr-auton_agent_sdr_auton --format '{{.Name}}' | grep -q sdr-auton_agent_sdr_auton; then
              docker service update --force --image agent-sdr-auton:latest sdr-auton_agent_sdr_auton
            else
              docker stack deploy --resolve-image=never -c ~/sdr-auton.yaml sdr-auton
            fi
            sleep 5
            docker service ps sdr-auton_agent_sdr_auton --no-trunc --format 'table {{.ID}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}' | head -5
