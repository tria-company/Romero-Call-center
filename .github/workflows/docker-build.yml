name: Deploy na VPS (Docker Swarm)

# Trigger: push pra main (auto-deploy) OU manual via Actions -> Run workflow.
#
# Pre-requisito: o primeiro deploy precisa ter sido feito manualmente
# (ver docs/deploy-vps-ubuntu.md). Este workflow assume que ja existe:
#   - /opt/Agent-Roberth (clone do repo)
#   - ~/roberth.yaml (com secrets reais editados)
#   - stack 'roberth' deployada pelo menos uma vez
#
# Secrets necessarios em Settings -> Secrets and variables -> Actions:
#   - VPS_HOST: IP publico da VPS (84.46.244.167)
#   - VPS_USER: usuario SSH (ex: root)
#   - VPS_SSH_KEY: chave SSH privada (conteudo do arquivo, geralmente ed25519)
#
# Setup completo: docs/auto-deploy-github-actions.md

on:
  push:
    branches: [main]
  workflow_dispatch: # rodar manualmente em Actions -> Run workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/Agent-Roberth
            git pull --ff-only
            docker build -t agent-roberth:latest .
            docker stack deploy --resolve-image=never -c ~/roberth.yaml roberth
            sleep 3
            docker service ps roberth_agent_roberth --no-trunc --format 'table {{.ID}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}' | head -5
