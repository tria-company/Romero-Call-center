name: Deploy na VPS (Docker Swarm)

# ATENÇÃO: neste BRANCH (ops/diagnostico-vps) o conteúdo é DIAGNÓSTICO
# somente-leitura — o deploy real vive na main. Dispatch:
#   gh workflow run docker-build.yml --ref ops/diagnostico-vps

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico conectividade ClickUp (somente leitura)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== 1) ClickUp do HOST (401 rapido = rede ok) ==="
            curl -s -o /dev/null -w 'host->clickup: HTTP %{http_code} em %{time_total}s\n' -m 12 https://api.clickup.com/api/v2/user || echo "host->clickup: FALHOU/TIMEOUT"
            echo "=== 2) ClickUp de DENTRO do container ==="
            CID=$(docker ps -q -f name=discador_discador | head -1)
            echo "container: $CID"
            docker exec $CID sh -c "time wget -T 10 -q -O /dev/null https://api.clickup.com/api/v2/user 2>&1; echo exit=\$?" || echo "wget dentro do container FALHOU"
            echo "=== 3) DNS dentro do container ==="
            docker exec $CID sh -c "nslookup api.clickup.com 2>&1 | tail -6" || true
            echo "=== 4) primeiro erro 'aborted' nos logs (com timestamp) ==="
            docker service logs -t --since 14h discador_discador 2>&1 | grep -i "operation was aborted" | head -2
            echo "=== 5) ultimo log SEM erro antes do primeiro aborted ==="
            docker service logs -t --since 14h discador_discador 2>&1 | grep -iv "aborted" | grep -i "clickup\|fila\|painel" | head -4
            echo "=== 6) Evolution de dentro do container (controle) ==="
            docker exec $CID sh -c "time wget -T 10 -q -O /dev/null https://apievo.gst.dev.br/ 2>&1; echo exit=\$?" || true
