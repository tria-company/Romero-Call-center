name: Deploy na VPS (Docker Swarm)

# ATENÇÃO: neste BRANCH (ops/diagnostico-vps) o conteúdo é DIAGNÓSTICO
# somente-leitura — o deploy real vive na main. Dispatch:
#   gh workflow run docker-build.yml --ref ops/diagnostico-vps
# LGPD: imprime só NOMES de env (valores mascarados) e logs (o backend não
# loga telefone/CPF por disciplina).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico (somente leitura)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== envs do service (SO NOMES) ==="
            docker service inspect discador_discador --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' | sed 's/=.*//' | sort
            echo "=== replicas ==="
            docker service ps discador_discador --format 'table {{.Name}}\t{{.CurrentState}}' | head -6
            echo "=== logs recentes com erro/audios/clickup/supabase ==="
            docker service logs --since 60m discador_discador 2>&1 | grep -i "erro\|error\|warn\|audios\|clickup\|supabase\|conversa" | tail -60
