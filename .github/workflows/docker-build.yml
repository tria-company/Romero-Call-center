name: Deploy na VPS (Docker Swarm)

# ATENÇÃO: neste BRANCH (ops/diagnostico-vps) o conteúdo é DIAGNÓSTICO +
# RECUPERAÇÃO DO REDIS — o deploy real vive na main. Dispatch:
#   gh workflow run docker-build.yml --ref ops/diagnostico-vps
# Segurança: nunca imprime REDIS_URL completo (pode conter senha) — só host/porta.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico e recuperacao do Redis
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -x
            echo "=== containers/servicos redis ==="
            docker service ls | grep -i redis || echo "(nenhum service redis)"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -i redis || echo "(nenhum container redis)"
            echo "=== REDIS_URL do discador (host:porta apenas) ==="
            RURL=$(docker service inspect discador_discador --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' | grep '^REDIS_URL=' | head -1 | cut -d= -f2-)
            if [ -z "$RURL" ]; then echo "REDIS_URL: (ausente no service)"; else echo "REDIS_URL host: $(echo "$RURL" | sed -E 's#^[a-z]+://([^@]*@)?##' )"; fi
            echo "=== tenta reviver redis ==="
            RSVC=$(docker service ls --format '{{.Name}}' | grep -i redis | head -1)
            RCTN=$(docker ps -a --format '{{.Names}}' | grep -i redis | head -1)
            if [ -n "$RSVC" ]; then
              docker service update --force "$RSVC" || true
            elif [ -n "$RCTN" ]; then
              docker restart "$RCTN" || true
            else
              echo "nenhum redis local pra reiniciar"
            fi
            sleep 8
            echo "=== reseta o discador (limpa clients redis/limiter presos) ==="
            docker service update --force --image discador-wavoip:latest discador_discador || true
            sleep 25
            docker service ps discador_discador --format 'table {{.Name}}\t{{.CurrentState}}' | head -4
            echo "=== prova: health + leitura ClickUp via backend ==="
            curl -s -o /dev/null -w 'health: %{http_code}\n' -m 8 http://localhost:4111/api/discador/health || true
            sleep 20
            curl -s -m 60 http://localhost:4111/api/discador/health >/dev/null 2>&1 || true
            echo "(fim — endpoints autenticados serao testados de fora)"
