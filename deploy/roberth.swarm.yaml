version: "3.7"
services:

## --------------------------- ORION --------------------------- ##

  agent_roberth:
    image: agent-roberth:latest ## Build local na VPS: docker build -t agent-roberth:latest /opt/Agent-Roberth

    networks:
      - public_network ## Nome da rede interna

    environment:
      ## 🤖 LLM (OpenAI)
      - OPENAI_API_KEY=COLAR_AQUI_OPENAI_KEY

      ## 📲 Evolution API (WhatsApp)
      - EVOLUTION_API_URL=https://evo.triacompany.com.br
      - EVOLUTION_API_KEY=COLAR_AQUI_EVOLUTION_KEY
      - EVOLUTION_INSTANCE_NAME=agente_test_01

      ## 🗄️ Supabase
      - SUPABASE_URL=https://COLAR_AQUI_PROJECT_ID.supabase.co
      - SUPABASE_ANON_KEY=COLAR_AQUI_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY=COLAR_AQUI_SERVICE_ROLE_KEY
      - SUPABASE_DB_URL=postgresql://postgres.COLAR_AQUI_PROJECT_ID:COLAR_AQUI_DB_PASSWORD_URL_ENCODED@aws-1-us-east-1.pooler.supabase.com:6543/postgres

      ## 🛒 Checkout (Kiwify)
      - CHECKOUT_URL_PRINCIPAL=https://kiwify.com.br/seu-produto
      - CHECKOUT_URL_ORDERBUMP=
      - CAMPANHA_NOME=lancamento_2026_q2

      ## 👥 Grupo de suporte (handoff humano)
      - SUPORTE_GRUPO_JID=120363407947419184@g.us

      ## ⚙️ Ambiente
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.agent_roberth.rule=Host(`roberth.84-46-244-167.sslip.io`) ## VPS Contabo tria-server
        - traefik.http.routers.agent_roberth.entrypoints=websecure
        - traefik.http.routers.agent_roberth.priority=1
        - traefik.http.routers.agent_roberth.tls.certresolver=letsencryptresolver
        - traefik.http.routers.agent_roberth.service=agent_roberth
        - traefik.http.services.agent_roberth.loadbalancer.server.port=4111
        - traefik.http.services.agent_roberth.loadbalancer.passHostHeader=1

## --------------------------- ORION --------------------------- ##

networks:
  public_network: ## Nome da rede interna
    external: true
    name: public_network ## Nome da rede interna
